name: Sync Fedora Ansible Inventory

on:
  schedule:
    # Run once a week on Sundays at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allows manual run on demand from GitHub UI

jobs:
  sync-inventory:
    name: Ingest Upstream Fedora Inventory
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Inventory Ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run db:generate
          npm run db:sync-ansible
